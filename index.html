    <!-- Google Fonts -->

<body>

    <!-- Top Navigation Header -->
    <header class="site-header" id="main-header">
        <a href="/" class="header-left" id="brand-logo" style="text-decoration: none; color: inherit;">
            <div class="mini-logo-container">
                <!-- Pixel Octopus Mini Logo SVG -->
                <svg width="34" height="34" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="17" cy="17" r="15.5" stroke="#000000" stroke-width="3" fill="#ffffff"/>
                    <!-- Pixel Octopus Body & Tentacles -->
                    <rect x="12" y="10" width="10" height="2" fill="#000000"/>
                    <rect x="10" y="12" width="14" height="7" fill="#000000"/>
                    <rect x="12" y="14" width="2" height="2" fill="#ffffff"/>
                    <rect x="20" y="14" width="2" height="2" fill="#ffffff"/>
                    <rect x="10" y="19" width="14" height="2" fill="#000000"/>
                    <!-- Tentacles -->
                    <rect x="9" y="21" width="2" height="4" fill="#000000"/>
                    <rect x="13" y="21" width="2" height="3" fill="#000000"/>
                    <rect x="17" y="21" width="2" height="4" fill="#000000"/>
                    <rect x="21" y="21" width="2" height="3" fill="#000000"/>
                    <rect x="23" y="22" width="2" height="3" fill="#000000"/>
                </svg>
            </div>
            <span class="brand-name">Orolius.</span>
        </a>

        <div class="header-right">
            <a href="/" class="nav-back-btn hidden" id="home-nav-btn" style="text-decoration: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>Back to Gateway</span>
            </a>
            <div class="active-portal-badge hidden" id="portal-indicator">INDIVIDUAL</div>
        </div>
    </header>

    <!-- Contact Info Section -->
    <section class="contact-info" style="padding:20px; background:#f9f9f9; text-align:center;">
      <p><strong>Contact us:</strong> <a href="mailto:sales@orolius.com">sales@orolius.com</a> | Phone: <a href="tel:8544746571">8544746571</a></p>
      <p>Address: Near cart Road, Shimla 171001</p>
    </section>

    <!-- MAIN GATEWAY / LANDING PAGE (Matches Image) -->
    <main class="view-container active" id="landing-gate">
        <div class="hero-center-box">
            <!-- Large Centered Pixel Octopus Logo Badge -->
            <div class="large-octopus-badge" id="hero-octopus">
                <svg width="160" height="160" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" stroke="#000000" stroke-width="6" fill="#ffffff"/>
                    <!-- Pixel Octopus Art -->
                    <path d="
                        M34,30 H66 V36 H72 V50 H66 V56 H60 V52 H56 V58 H52 V54 H48 V58 H44 V52 H40 V56 H34 V50 H28 V36 H34 Z
                    " fill="#000000"/>
                    <!-- Eyes -->
                    <rect x="38" y="38" width="5" height="5" fill="#ffffff"/>
                    <rect x="57" y="38" width="5" height="5" fill="#ffffff"/>
                    <!-- Tentacle Pixels -->
                    <rect x="30" y="56" width="5" height="10" fill="#000000"/>
                    <rect x="27" y="62" width="5" height="6" fill="#000000"/>
                    <rect x="40" y="56" width="5" height="8" fill="#000000"/>
                    <rect x="43" y="64" width="5" height="5" fill="#000000"/>
                    <rect x="55" y="56" width="5" height="8" fill="#000000"/>
                    <rect x="52" y="64" width="5" height="5" fill="#000000"/>
                    <rect x="65" y="56" width="5" height="10" fill="#000000"/>
                    <rect x="68" y="62" width="5" height="6" fill="#000000"/>
                </svg>
            </div>

            <h1 class="landing-title">who are you?</h1>

            <div class="portal-selector-group">
                <a href="/individual/" class="pill-btn" id="btn-select-individual" style="text-decoration: none;">
                    INDIVIDUAL
                </a>
                <a href="/business/" class="pill-btn" id="btn-select-business" style="text-decoration: none;">
                    BUSINESS
                </a>
            </div>
        </div>

        <!-- Floating Bottom Right Social / Contact Icons -->
        <div class="floating-social-group">
            <button class="social-circle-btn" id="contact-email-btn" title="Contact Us via Email" aria-label="Contact Email">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="3"></rect>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
                </svg>
            </button>
            <button class="social-circle-btn" id="contact-fb-btn" title="Visit Facebook Page" aria-label="Facebook Page">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>
                </svg>
            </button>
        </div>
    </main>


    <!-- UNIVERSAL MODAL SYSTEM -->
    <div class="modal-overlay" id="modal-container">
        <div class="modal-card" id="modal-card">
            <button class="modal-close-btn" id="modal-close" aria-label="Close modal">&times;</button>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic Content Injected via JS -->
            </div>

    </div>

    <!-- Footer with Business Information -->
    <footer style="background:#222; color:#fff; padding:30px; text-align:center;">
      <p>&copy; 2026 Orolius. All rights reserved.</p>
      <p>Contact: <a href="mailto:sales@orolius.com" style="color:#fff;">sales@orolius.com</a> | Phone: <a href="tel:8544746571" style="color:#fff;">8544746571</a></p>
