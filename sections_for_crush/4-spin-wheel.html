<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spin the wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#170f2b; --card:#211640; --gold:#e7b955; --blush:#f0a8c4; --lavender:#a394c9; --cream:#f7f1e6; --line:rgba(247,241,230,0.14); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--cream);font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;}
  .wrap{max-width:340px;width:100%;text-align:center;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0 0 10px;}
  h2{font-family:'Playfair Display',serif;font-size:clamp(22px,5vw,28px);margin:0 0 26px;}

  .wheel-box{position:relative;width:240px;height:240px;margin:0 auto 24px;}
  #pointer{
    position:absolute;top:-6px;left:50%;transform:translateX(-50%);
    width:0;height:0;
    border-left:10px solid transparent;
    border-right:10px solid transparent;
    border-top:16px solid var(--gold);
    z-index:2;
  }
  #wheel{
    width:100%;height:100%;border-radius:50%;
    border:4px solid var(--card);
    transition:transform 4s cubic-bezier(0.15,0.8,0.15,1);
    position:relative;
  }
  #wheel span{
    position:absolute;
    top:50%;left:50%;
    font-family:'Space Mono',monospace;
    font-size:11px;
    font-weight:700;
    color:#170f2b;
    transform-origin:0 0;
    white-space:nowrap;
  }
  #spin-btn{
    background:var(--gold);color:#241a06;border:none;border-radius:24px;
    padding:12px 30px;font-size:13px;font-weight:600;cursor:pointer;
  }
  #spin-btn:disabled{opacity:0.5;cursor:default;}
  #result{margin-top:16px;font-family:'Playfair Display',serif;font-style:italic;font-size:16px;color:var(--blush);min-height:24px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">can't decide?</p>
  <h2>spin for our next plan</h2>
  <div class="wheel-box">
    <div id="pointer"></div>
    <div id="wheel"></div>
  </div>
  <button id="spin-btn">spin the wheel</button>
  <p id="result"></p>
</div>

<script>
(function(){
  // EDIT THIS: your own options, any number works
  var options = ['movie night', 'coffee date', 'mini golf', 'game night', 'a walk', 'stargazing'];
  var colors = ['#e7b955', '#f0a8c4', '#a394c9', '#8bc7a0', '#e78c6b', '#7fb3d5'];

  var wheel = document.getElementById('wheel');
  var btn = document.getElementById('spin-btn');
  var result = document.getElementById('result');
  var n = options.length;
  var seg = 360 / n;
  var currentRotation = 0;

  var gradientParts = options.map(function(_, i){
    var start = i * seg;
    var end = start + seg;
    return colors[i % colors.length] + ' ' + start + 'deg ' + end + 'deg';
  });
  wheel.style.background = 'conic-gradient(' + gradientParts.join(',') + ')';

  options.forEach(function(label, i){
    var mid = i * seg + seg / 2;
    var s = document.createElement('span');
    s.textContent = label;
    s.style.transform = 'rotate(' + mid + 'deg) translate(46px, -4px)';
    wheel.appendChild(s);
  });

  btn.addEventListener('click', function(){
    btn.disabled = true;
    result.textContent = '';
    var extraSpins = 5;
    var randomIndex = Math.floor(Math.random() * n);
    var targetAngle = 360 - (randomIndex * seg + seg / 2);
    var finalRotation = currentRotation + extraSpins * 360 + targetAngle - (currentRotation % 360);
    currentRotation = finalRotation;
    wheel.style.transform = 'rotate(' + finalRotation + 'deg)';

    setTimeout(function(){
      result.textContent = 'landed on: ' + options[randomIndex];
      btn.disabled = false;
    }, 4100);
  });
})();
</script>
</body>
</html>
