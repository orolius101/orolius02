<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#170f2b; --card:#211640; --gold:#e7b955; --blush:#f0a8c4; --lavender:#a394c9; --cream:#f7f1e6; --line:rgba(247,241,230,0.14); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--cream);font-family:'Poppins',sans-serif;min-height:100vh;padding:48px 20px;}
  .wrap{max-width:520px;margin:0 auto;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0 0 10px;}
  h2{font-family:'Playfair Display',serif;font-size:clamp(22px,5vw,28px);margin:0 0 22px;}

  .coupons{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .coupon{
    position:relative;
    background:var(--card);
    border-radius:12px;
    padding:16px 14px;
    border:1.5px dashed rgba(247,241,230,0.3);
    cursor:pointer;
    transition:opacity .3s ease, transform .2s ease;
  }
  .coupon:hover{transform:translateY(-2px);}
  .coupon .tag{font-family:'Space Mono',monospace;font-size:9px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin:0 0 8px;}
  .coupon .title{font-family:'Playfair Display',serif;font-size:15px;margin:0 0 10px;line-height:1.3;}
  .coupon .redeem-btn{
    background:transparent;border:1px solid var(--gold);color:var(--gold);
    font-size:11px;padding:6px 12px;border-radius:14px;cursor:pointer;
  }
  .coupon.used{opacity:0.4;}
  .coupon.used .redeem-btn{border-color:var(--lavender);color:var(--lavender);}
  .coupon.used .redeem-btn::after{content:' ✓';}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">redeemable, no expiration</p>
  <h2>a small book of coupons</h2>
  <div class="coupons" id="coupons"></div>
</div>

<script>
(function(){
  // EDIT THIS: your own coupons
  var coupons = [
    'one hug, no questions asked',
    'i cook, you pick what',
    'a full afternoon, phones away',
    'you win the next argument, guaranteed',
    'one home-cooked breakfast in bed',
    'i handle the thing you\'ve been avoiding'
  ];

  var wrap = document.getElementById('coupons');

  coupons.forEach(function(text){
    var c = document.createElement('div');
    c.className = 'coupon';
    c.innerHTML =
      '<p class="tag">coupon</p>' +
      '<p class="title">' + text + '</p>' +
      '<button class="redeem-btn">redeem</button>';

    c.querySelector('.redeem-btn').addEventListener('click', function(e){
      e.stopPropagation();
      c.classList.toggle('used');
      this.textContent = c.classList.contains('used') ? 'redeemed' : 'redeem';
    });

    wrap.appendChild(c);
  });
})();
</script>
</body>
</html>
