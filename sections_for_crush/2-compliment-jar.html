<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compliment jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Space+Mono:wght@400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#170f2b; --card:#211640; --gold:#e7b955; --blush:#f0a8c4; --lavender:#a394c9; --cream:#f7f1e6; --line:rgba(247,241,230,0.14); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--cream);font-family:'Poppins',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;}
  .wrap{max-width:360px;width:100%;text-align:center;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0 0 10px;}
  h2{font-family:'Playfair Display',serif;font-size:clamp(22px,5vw,28px);margin:0 0 22px;}

  .jar{
    width:110px;height:130px;margin:0 auto 20px;
    background:rgba(247,241,230,0.08);
    border:2px solid rgba(247,241,230,0.25);
    border-radius:14px 14px 26px 26px;
    position:relative;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .jar:hover{transform:scale(1.04);}
  .jar:active{transform:scale(0.97);}
  .jar::before{
    content:'';
    position:absolute;top:-14px;left:50%;transform:translateX(-50%);
    width:60px;height:16px;
    background:rgba(247,241,230,0.25);
    border-radius:4px;
  }
  .jar .icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;}

  #note-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:12px;
  }
  #note-text{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:16px;
    color:var(--blush);
    margin:0;
  }
  #note-text.placeholder{color:rgba(247,241,230,0.4);font-style:normal;font-family:'Poppins',sans-serif;font-size:13px;}
  #count{font-family:'Space Mono',monospace;font-size:11px;color:var(--lavender);}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">the compliment jar</p>
  <h2>tap the jar</h2>
  <div class="jar" id="jar" role="button" tabindex="0" aria-label="tap for a compliment">
    <div class="icon">🫙</div>
  </div>
  <div id="note-card">
    <p id="note-text" class="placeholder">one note comes out each time you tap</p>
  </div>
  <p id="count">0 opened</p>
</div>

<script>
(function(){
  // EDIT THIS: swap in real, specific reasons instead of generic ones
  var notes = [
    "the way you laugh at your own jokes before finishing them",
    "how you remember details i mention once, in passing",
    "you make ordinary days feel less ordinary",
    "the specific way you say my name when you're annoyed",
    "you're the easiest person i've ever had to talk to",
    "i genuinely look forward to seeing your texts",
    "you make everyone around you a little more comfortable",
    "you're funnier than you think you are"
  ];

  var jar = document.getElementById('jar');
  var noteText = document.getElementById('note-text');
  var countEl = document.getElementById('count');
  var opened = 0;
  var lastIndex = -1;

  function randomNote(){
    var i;
    do { i = Math.floor(Math.random() * notes.length); } while (i === lastIndex && notes.length > 1);
    lastIndex = i;
    return notes[i];
  }

  function openJar(){
    noteText.textContent = randomNote();
    noteText.classList.remove('placeholder');
    opened++;
    countEl.textContent = opened + (opened === 1 ? ' opened' : ' opened');
  }

  jar.addEventListener('click', openJar);
  jar.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openJar(); }
  });
})();
</script>
</body>
</html>
