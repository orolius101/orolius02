<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Space+Mono:wght@400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#170f2b; --card:#211640; --gold:#e7b955; --blush:#f0a8c4; --lavender:#a394c9; --cream:#f7f1e6; --line:rgba(247,241,230,0.14); }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--cream);font-family:'Poppins',sans-serif;min-height:100vh;padding:48px 20px;}
  .wrap{max-width:560px;margin:0 auto;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:0 0 10px;}
  h2{font-family:'Playfair Display',serif;font-size:clamp(22px,5vw,28px);margin:0 0 22px;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .thumb{
    aspect-ratio:1;
    border-radius:10px;
    background:var(--card);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    font-size:20px;
    color:var(--lavender);
    transition:transform .15s ease;
  }
  .thumb:hover{transform:scale(1.03);}

  #lightbox{
    position:fixed;inset:0;
    background:rgba(10,6,20,0.92);
    display:none;
    align-items:center;justify-content:center;
    flex-direction:column;
    padding:20px;
    z-index:10;
  }
  #lightbox.open{display:flex;}
  #lb-frame{
    width:min(90vw,420px);
    aspect-ratio:4/3;
    background:var(--card);
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    font-size:40px;
    color:var(--lavender);
  }
  #lb-caption{margin-top:14px;font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:var(--blush);text-align:center;max-width:400px;}
  .lb-controls{display:flex;align-items:center;gap:20px;margin-top:18px;}
  .lb-btn{
    background:transparent;border:1px solid rgba(247,241,230,0.3);color:var(--cream);
    border-radius:50%;width:38px;height:38px;font-size:16px;cursor:pointer;
  }
  #lb-close{
    position:absolute;top:20px;right:24px;
    background:transparent;border:none;color:var(--cream);font-size:26px;cursor:pointer;
  }
  #lb-count{font-family:'Space Mono',monospace;font-size:11px;color:var(--lavender);}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">our moments</p>
  <h2>tap any photo</h2>
  <div class="grid" id="grid"></div>
</div>

<div id="lightbox">
  <button id="lb-close" aria-label="close">×</button>
  <div id="lb-frame">📷</div>
  <p id="lb-caption"></p>
  <div class="lb-controls">
    <button class="lb-btn" id="lb-prev" aria-label="previous">‹</button>
    <span id="lb-count"></span>
    <button class="lb-btn" id="lb-next" aria-label="next">›</button>
  </div>
</div>

<script>
(function(){
  // EDIT THIS: swap captions to match your real photos. Replace thumb/frame
  // content with <img> tags once you have real images to drop in.
  var photos = [
    { caption: 'the first photo we ever took together' },
    { caption: 'that trip where everything went sideways, somehow the best one' },
    { caption: 'a completely ordinary tuesday, kept anyway' },
    { caption: 'the one you hate but I refuse to delete' },
    { caption: 'us, mid-argument about where to eat' },
    { caption: 'the last one, taken more recently than it feels' }
  ];

  var grid = document.getElementById('grid');
  var lightbox = document.getElementById('lightbox');
  var frame = document.getElementById('lb-frame');
  var caption = document.getElementById('lb-caption');
  var count = document.getElementById('lb-count');
  var current = 0;

  photos.forEach(function(_, i){
    var t = document.createElement('div');
    t.className = 'thumb';
    t.textContent = '📷';
    t.addEventListener('click', function(){ open(i); });
    grid.appendChild(t);
  });

  function open(i){
    current = i;
    render();
    lightbox.classList.add('open');
  }
  function render(){
    caption.textContent = photos[current].caption;
    count.textContent = (current + 1) + ' / ' + photos.length;
  }
  function close(){ lightbox.classList.remove('open'); }
  function next(){ current = (current + 1) % photos.length; render(); }
  function prev(){ current = (current - 1 + photos.length) % photos.length; render(); }

  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-next').addEventListener('click', next);
  document.getElementById('lb-prev').addEventListener('click', prev);
  lightbox.addEventListener('click', function(e){ if (e.target === lightbox) close(); });
  window.addEventListener('keydown', function(e){
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') prev();
  });
})();
</script>
</body>
</html>
